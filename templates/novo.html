<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Novo Chamado</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
  <h1>Novo chamado</h1>
  <form method="post" class="card p-4 bg-white">
    <label class="form-label">Solicitante</label>
    <input name="solicitante" class="form-control mb-3" required>

    <label class="form-label">Categoria</label>
    <select name="categoria" class="form-select mb-3">
      <option>Hardware</option><option>Software</option><option>Rede</option><option>Acesso</option><option>Sistema</option>
    </select>

    <label class="form-label">Prioridade</label>
    <select name="prioridade" class="form-select mb-3">
      <option>Baixa</option><option>Média</option><option>Alta</option><option>Crítica</option>
    </select>

    <label class="form-label">Descrição</label>
    <textarea name="descricao" class="form-control mb-3" rows="4" required></textarea>

    <button class="btn btn-primary">Cadastrar</button>
    <a class="btn btn-link" href="/">Voltar</a>
  </form>
</div>
</body>
</html>
